name: Actualitzar GTFS de FGV (TRAM d'Alacant)

# S'executa sol cada dilluns a les 4:00 UTC, i també es pot llançar
# manualment des de la pestanya "Actions" del repositori si mai cal
# forçar una actualització abans d'hora.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualitzar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositori
        uses: actions/checkout@v4

      - name: Baixar el GTFS de FGV
        run: |
          mkdir -p gtfs-fgv
          curl -f -L -A "Mozilla/5.0" -o gtfs-fgv/google_transit.zip \
            "http://www.tramalicante.es/google_transit_feed/google_transit.zip"

      - name: Pujar el fitxer si ha canviat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gtfs-fgv/google_transit.zip
          git diff --cached --quiet || git commit -m "Actualitza GTFS de FGV (automàtic)"
          git push
